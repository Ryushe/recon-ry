# Tool and Stage State Configuration
# Tracks which tools and stages are enabled/disabled.
# NOTE: Comments are stripped when the TUI writes updates.

tools:
  # -- subdomain_enum -----------------------------------------------------------
  subfinder: true
  crt_sh: true
  assetfinder: true
  amass: true
  dns_bruteforce: true

  # -- url_discovery ------------------------------------------------------------
  katana: true
  hakrawler: false
  waybackurls: true
  gau: true
  waymore_urls: false

  # -- alive_check --------------------------------------------------------------
  httpx: true

  # -- param_discovery ----------------------------------------------------------
  param_recon: true
  passive_param_recon: true
  waymore: true
  xnlinkfinder: true
  uro: true
  js_files: true
  unclutter_jsfiles: true

  # -- dir_enum -----------------------------------------------------------------
  ffuf: true

  # -- secret_scan --------------------------------------------------------------
  nuclei: false
  trufflehog: true
  secret_finder: true

  # -- eyewitness ---------------------------------------------------------------
  eyewitness: false

  # -- dork (standalone) --------------------------------------------------------
  dork_scan: false

  # -- legacy / orphaned (defined but wired to no stage) ------------------------
  gospider: false
  gau_params: true

stages:
  # Full profile run order
  subdomain_enum: true
  url_discovery: true
  passive_url_discovery: true
  alive_check: true
  param_discovery: true
  passive_param_discovery: true
  passive_param_normalize: true
  dir_enum: true
  secret_scan: true
  eyewitness: false

  # Standalone profiles
  dork: false
