# Tool and Stage State Configuration
# Tracks which tools and stages are enabled/disabled.
# NOTE: Comments are stripped when the TUI writes updates.

tools:
  # -- subdomain_enum -----------------------------------------------------------
  subfinder: true
  crt_sh: true
  assetfinder: true
  amass: true
  dns_bruteforce: true

  # -- url_discovery ------------------------------------------------------------
  katana: true
  hakrawler: false
  waybackurls: true
  gau: true
  waymore_urls: true

  # -- alive_check --------------------------------------------------------------
  httpx: true

  # -- param_discovery ----------------------------------------------------------
  param_recon: true
  passive_param_recon: true
  gau_params: true
  uro: true
  js_files: true
  unclutter_jsfiles: true

  # -- dir_enum -----------------------------------------------------------------
  ffuf: true

  # -- secret_scan --------------------------------------------------------------
  nuclei: true
  trufflehog: true
  secret_finder: true

  # -- eyewitness ---------------------------------------------------------------
  eyewitness: false

  # -- dork (standalone) --------------------------------------------------------
  dork_scan: false

  # -- driven by scripts/param_recon.sh, NOT by the stage runner ----------------
  # These are invoked inside param_recon.sh behind its own --no-<tool> flags, so
  # they are absent from every stage's tools list and these toggles are NOT
  # consulted. Changing them here has no effect; pass the script flags instead.
  # Listed so the tools stay visible rather than looking uninstalled or dead.
  waymore: true
  xnlinkfinder: true
  gospider: false

stages:
  # Full profile run order
  subdomain_enum: true
  url_discovery: true
  passive_url_discovery: true
  alive_check: true
  param_discovery: true
  passive_param_discovery: true
  passive_param_normalize: true
  dir_enum: true
  secret_scan: true
  eyewitness: false

  # Standalone profiles
  dork: false
